name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The fog, tile and backup logic lives in a plain JVM module, so it is tested
      # without an emulator or an Android device.
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      # The release key lives in repository secrets, never in the repo: this is a public
      # repository, and anyone holding the key could build an APK that installs over yours as a
      # legitimate update. Absent the secrets the build still runs, but its signature is not
      # stable and it cannot be updated in place - see README.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ROAMED_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Unstable signing::ROAMED_KEYSTORE_BASE64 is not set. The release APK will be signed with a throwaway debug key that differs on every run, so it cannot be installed as an update over a previous build. See the Signing section of the README."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roamed-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Before lint: lint runs with continue-on-error, so a compilation failure there would be
      # reported as a green step. The APK build is what must actually fail the job.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
        continue-on-error: true

      - name: Build release APK
        env:
          ROAMED_KEYSTORE_FILE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/roamed-release.jks', runner.temp) || '' }}
          ROAMED_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.configured == 'true' && secrets.ROAMED_KEYSTORE_PASSWORD || '' }}
          ROAMED_KEY_ALIAS: ${{ steps.signing.outputs.configured == 'true' && secrets.ROAMED_KEY_ALIAS || '' }}
          ROAMED_KEY_PASSWORD: ${{ steps.signing.outputs.configured == 'true' && secrets.ROAMED_KEY_PASSWORD || '' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Printed on every run so a change of signing key is visible here rather than discovered as
      # a failed install on a phone. This fingerprint must stay identical build to build.
      #
      # Every failure path exits non-zero on purpose: a check that can go quiet when it cannot
      # find the tool or the APK is worse than no check, because it still reports green.
      - name: Report signing certificate
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set; cannot locate apksigner."
            exit 1
          fi
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::No apksigner found under $sdk/build-tools."
            exit 1
          fi
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APK to verify."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "### $apk"
            "$apksigner" verify --print-certs "$apk" | tee /tmp/roamed-certs.txt
            # A cert digest must actually have been printed, not merely exit 0.
            grep -q "certificate SHA-256 digest" /tmp/roamed-certs.txt || {
              echo "::error::apksigner produced no certificate digest for $apk."
              exit 1
            }
          done

      - name: Delete signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/roamed-release.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: roamed-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
